<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haval — carro</title>
<!--
  Renderizador MÍNIMO: só o carro, nada de interface.

  Existe porque o viewer do Haval-H6-3D não tem modo "só o carro" — ele sempre
  monta o shell inteiro (widgets, desktops, chrome). Esconder aquilo com CSS por
  cima do DOM dele quebraria na primeira atualização que o autor fizesse. Aqui eu
  carrego o MESMO GLB com Three.js e desenho só o veículo, com controle total.

  Estado do carro entra por `window.onCarDataUpdate(chave, valor)` — o mesmo ponto
  de entrada do viewer, então o hospedeiro nativo alimenta os dois igual.

  Render sob demanda: nada de loop contínuo. Redesenha quando algo muda, quando o
  dedo arrasta, e para de vez quando a tela sai de vista. Numa home que fica aberta
  o dia todo, loop a 60 fps é bateria queimada à toa.
-->
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
            -webkit-user-select:none;user-select:none}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  #cadeado{position:absolute;left:10px;bottom:8px;color:#ff7a18;line-height:0;
           filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));pointer-events:none}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:#8a8a90;font:12px -apple-system,system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="msg">carregando o carro…</div>
<!-- Tranca não tem geometria pra acender: cadeado é o único jeito honesto.
     Só aparece DESTRANCADO — trancado é o estado normal e não merece pixel. -->
<div id="cadeado" hidden aria-label="destrancado">
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
       stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="11" width="17" height="10.5" rx="2.2"></rect>
    <path d="M7.5 11V7a4.5 4.5 0 0 1 8.6-1.8"></path>
  </svg>
</div>

<script src="/3d/vendor/three/build/three.min.js"></script>
<script src="/3d/vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="/3d/vendor/three/examples/js/loaders/DRACOLoader.js"></script>
<!-- WorkerPool ANTES do KTX2Loader: no build legado examples/js ele é arquivo
     separado e NÃO está no three.min.js. Sem ele o KTX2Loader não reclama — só
     nunca resolve, e o carregamento fica parado em "carregando" pra sempre. -->
<script src="/3d/vendor/three/examples/js/utils/WorkerPool.js"></script>
<script src="/3d/vendor/three/examples/js/loaders/KTX2Loader.js"></script>
<!-- Ambiente: o GLB usa KHR_materials_transmission/volume, e material com
     transmissão renderiza PRETO sem scene.environment. Era o que fazia sumir
     pedaço do carro. RoomEnvironment é gerado em memória — não custa download. -->
<script src="/3d/vendor/three/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var MODELO = qs.get('modelo') || '/3d/assets/haval-h6-hev-lite.glb';

  var cv = document.getElementById('cv'), msg = document.getElementById('msg');
  var renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));  // 3x não se vê e custa 2,25×
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  // Exposição contida. Com 1.05 e as luzes fortes que eu tinha, `cc0000` (vermelho
  // ESCURO) saía laranja vivo e o cinza chumbo virava prata: a pintura era lavada
  // pela soma de key + rim + ambiente. Cor pedida tem que ser a cor vista.
  renderer.toneMappingExposure = parseFloat(qs.get('exp') || '0.82');

  var scene = new THREE.Scene();
  try {
    var pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
    // O ambiente existe pra transmissão/vidro funcionar, não pra iluminar a lataria.
    if ('environmentIntensity' in scene) scene.environmentIntensity = 0.45;
  } catch (e) { console.warn('[carro] sem ambiente:', e); }
  var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

  // Luz: sem HDR pra não pagar mais um download. Um key quente alto, um fill frio
  // baixo e um rim atrás — suficiente pra lataria escura não virar silhueta chapada.
  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x0a0a0c, 0.30));
  var key = new THREE.DirectionalLight(0xffffff, 1.15); key.position.set(4, 6, 5);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0x9fc0ff, 0.35); fill.position.set(-5, 2, 3);
  scene.add(fill);
  var rim = new THREE.DirectionalLight(0xffffff, 0.65); rim.position.set(-2, 3, -6);
  scene.add(rim);

  var carro = null, raio = 3, alvo = new THREE.Vector3();
  var tam = new THREE.Vector3(4.6, 1.7, 1.9);   // dimensões reais, preenchidas no load
  // 3/4 DIANTEIRO — e o ângulo é 1,78π, não 0,78π. O comentário antigo estava
  // invertido: 0,78π renderiza a TRASEIRA (tampa, HAVAL, lanterna), conferido em
  // captura. Meia volta resolve, e é o enquadramento que mostra grade e faróis.
  var giro = parseFloat(qs.get('giro') || String(Math.PI * 1.78));
  var alturaCam = 0.28;

  function enquadra() {
    var l = cv.clientWidth || 1, a = cv.clientHeight || 1;
    camera.aspect = l / a;
    // Distância que FAZ CABER, calculada do FOV — não multiplicador no olho. Metade
    // da maior dimensão sobre a tangente de meio-FOV é a conta clássica; em retrato
    // divide pelo aspecto, porque aí quem limita é a largura, não a altura.
    // Enquadra pela SILHUETA projetada, não pela maior dimensão do carro. Usar
    // `raio` (metade do maior lado, 2,49 m) tratava o carro como uma esfera desse
    // tamanho: num 3/4 a silhueta é bem menor que isso e sobrava moldura — o carro
    // saía pequeno no meio de um retângulo vazio.
    //
    // Largura projetada = quanto do comprimento e da largura caem no eixo
    // horizontal da câmera, no ângulo atual. Altura projetada é a altura mesmo.
    var vfov = camera.fov * Math.PI / 180;
    var hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
    var projL = Math.abs(tam.x * Math.cos(giro)) + Math.abs(tam.z * Math.sin(giro));
    var distH = (projL / 2) / Math.tan(hfov / 2);
    var distV = (tam.y / 2) / Math.tan(vfov / 2);
    var recuo = Math.max(distH, distV) * parseFloat(qs.get('folga') || '1.10');
    camera.position.set(
      alvo.x + Math.sin(giro) * recuo,
      alvo.y + raio * alturaCam * 2.2,
      alvo.z + Math.cos(giro) * recuo
    );
    camera.lookAt(alvo);
    camera.updateProjectionMatrix();
    renderer.setSize(l, a, false);
  }

  var precisaDesenhar = true;
  function pede() { precisaDesenhar = true; }
  function laco() {
    requestAnimationFrame(laco);
    if (!precisaDesenhar || document.hidden) return;   // parado = nada de GPU
    precisaDesenhar = false;
    enquadra();
    renderer.render(scene, camera);
  }
  laco();

  window.addEventListener('resize', pede);
  document.addEventListener('visibilitychange', pede);

  // Arrastar gira. Sem OrbitControls: só preciso de um eixo, e o arquivo dele
  // custaria mais que estas dez linhas.
  var arrastando = false, x0 = 0, g0 = 0;
  cv.addEventListener('pointerdown', function (e) { arrastando = true; x0 = e.clientX; g0 = giro; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) { if (!arrastando) return; giro = g0 - (e.clientX - x0) * 0.008; pede(); });
  cv.addEventListener('pointerup',   function () { arrastando = false; });

  // O GLB traz geometria Draco E textura KTX2/Basis. Faltando qualquer um dos dois
  // transcodificadores o load falha inteiro — foi o que me pegou: sem o KTX2Loader
  // o erro vem como 'setKTX2Loader must be called before loading KTX2 textures'.
  var draco = new THREE.DRACOLoader();
  draco.setDecoderPath('/3d/vendor/draco/');
  var ktx2 = new THREE.KTX2Loader();
  ktx2.setTranscoderPath('/3d/vendor/basis/');
  ktx2.detectSupport(renderer);          // escolhe o formato que a GPU aceita
  var loader = new THREE.GLTFLoader();
  loader.setDRACOLoader(draco);
  loader.setKTX2Loader(ktx2);

  loader.load(MODELO, function (gltf) {
    carro = gltf.scene;
    // O GLB não traz só o veículo: vem com um plano de 310 unidades junto (chão ou
    // céu). Medir a cena inteira dava caixa 309×1,8×309 e o enquadramento ia parar
    // a 270 unidades de distância — carro invisível, tela branca. Esconde e ignora
    // qualquer malha grande demais pra ser carro; um H6 tem 4,6 m.
    var LIMITE = 15, ignoradas = 0;
    var box = new THREE.Box3();
    var bm = new THREE.Box3(), tm = new THREE.Vector3();
    carro.traverse(function (o) {
      if (!o.isMesh) return;
      bm.setFromObject(o); bm.getSize(tm);
      // DUAS decisões diferentes, que eu tinha juntado numa só e paguei caro:
      //   > 50 un  → é cenário mesmo (BuildingMesh de milhares), esconde.
      //   > 15 un  → não entra no enquadramento, mas CONTINUA visível.
      // Juntar as duas sumiu com o painel da lateral traseira e deixou o interior
      // do porta-malas à mostra — o "faltando pedaços do carro".
      // NÃO esconde nada. Aprendi errando duas vezes: `BuildingMesh-00010_1` e
      // `_2` medem 118.961 unidades por bounding box e são PEÇAS DO CARRO (material
      // Plastic Black, a lateral traseira). A caixa da cena inteira dá 309, então
      // essas medidas por malha são mentira — vértice degenerado na geometria, não
      // tamanho real. Esconder por elas arrancava painel do carro, que foi o
      // "faltando pedaços". O filtro fica SÓ pra decidir o enquadramento.
      if (Math.max(tm.x, tm.z) > LIMITE) { ignoradas++; return; }
      box.union(bm);
    });
    if (box.isEmpty()) box.setFromObject(carro);   // nada sobrou: volta ao ingênuo
    var c = box.getCenter(new THREE.Vector3()), t = box.getSize(new THREE.Vector3());
    tam.copy(t);
    raio = Math.max(t.x, t.y, t.z) / 2;
    // Assenta no chão e centra na origem: o GLB pode vir com pivô em qualquer lugar.
    carro.position.sub(c);
    carro.position.y += t.y / 2;
    alvo.set(0, t.y * 0.45, 0);
    // Pintura. O material da lataria se chama `Body` no GLB. Troco a cor dele e
    // NÃO a de tudo: `car_black_plastic`, vidro e roda também são materiais, e
    // pintar por varredura deixaria o carro inteiro monocromático.
    // ?mats=1 pinta por MATERIAL pra eu enxergar quem é quem: vermelho = Body,
    // verde = Roof (os dois que o viewer trata como pintura no HEV), azul =
    // Plastic Black. Enxergar vence deduzir.
    if (qs.get('mats') === '1') {
      var CORES = { 'Body': 0xff3333, 'Roof': 0x33ff33, 'Plastic Black': 0x3366ff };
      carro.traverse(function (o) {
        if (!o.isMesh || !o.material) return;
        var c = CORES[o.material.name];
        if (c === undefined) return;
        var m = o.material.clone(); m.color = new THREE.Color(c);
        if ('emissive' in m) m.emissive = new THREE.Color(c * 0);
        o.material = m;
      });
    }
    // ?portas=1 pinta as malhas sob os nós Door_*/Hinge_TRUNK, pra localizar de
    // onde vem a área escura sem ficar adivinhando por formato.
    if (qs.get('portas') === '1') {
      carro.traverse(function (o) {
        if (!/^(Door_|Hinge_TRUNK)/i.test(o.name || '')) return;
        o.traverse(function (x) {
          if (!x.isMesh || !x.material) return;
          var m = x.material.clone(); m.color = new THREE.Color(0xff2222); x.material = m;
        });
      });
    }
    var cor = qs.get('cor');
    if (cor) {
      carro.traverse(function (o) {
        // O perfil HEV do viewer trata `Body` E `Roof` como pintura
        // (bodyPaintRe: /^(body|roof)$/i). Só `Body` deixava o teto de outra cor.
        if (!o.isMesh || !o.material || !/^(body|roof)$/i.test(o.material.name || '')) return;
        // Clona: o material é compartilhado entre as peças da lataria, e mexer no
        // original vaza pra qualquer outra instância que venha a usá-lo.
        var m = o.material.clone();
        m.color = new THREE.Color(cor.charAt(0) === '#' ? cor : '#' + cor);
        // Sem zerar o mapa, a cor MULTIPLICA a textura branca da lataria e o
        // resultado continua lendo branco — foi o que aconteceu com o cinza.
        // Também baixo o metalness: lataria muito metálica reflete o ambiente
        // claro e clareia de volta a cor que acabei de aplicar.
        if (m.map) m.map = null;
        if ('metalness' in m) m.metalness = Math.min(m.metalness, 0.35);
        if ('roughness' in m) m.roughness = Math.max(m.roughness, 0.35);
        m.needsUpdate = true;
        o.material = m;
      });
    }
    scene.add(carro);

    // ── Sombra de contato ─────────────────────────────────────────────────────
    // Sem isso o carro flutua no preto e lê como recorte colado. Não uso mapa de
    // sombra: o custo por quadro não se justifica num carro parado, e a mancha
    // elíptica embaixo entrega 90% da sensação de assentamento por quase nada.
    (function () {
      var S = 256, cv2 = document.createElement('canvas');
      cv2.width = cv2.height = S;
      var g2 = cv2.getContext('2d');
      var grad = g2.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      // Queda RÁPIDA. Com um degradê suave a mancha parecia uma poça gigante
      // espalhada atrás do carro, porque no chão em perspectiva ela se estica.
      grad.addColorStop(0,    'rgba(0,0,0,0.60)');
      grad.addColorStop(0.30, 'rgba(0,0,0,0.34)');
      grad.addColorStop(0.62, 'rgba(0,0,0,0.08)');
      grad.addColorStop(1,    'rgba(0,0,0,0)');
      g2.fillStyle = grad; g2.fillRect(0, 0, S, S);
      var tex2 = new THREE.CanvasTexture(cv2);
      var sombra = new THREE.Mesh(
        // Pegada do carro, não uma área arbitrária: comprimento por largura, com
        // pouca folga. Eu tinha posto 2× a LARGURA e virou mancha do tamanho da tela.
        new THREE.PlaneGeometry(t.x * 1.06, t.z * 1.12),
        new THREE.MeshBasicMaterial({ map: tex2, transparent: true, depthWrite: false })
      );
      sombra.rotation.x = -Math.PI / 2;
      // Assenta no ponto mais baixo MEDIDO do carro, não em y=0. Eu supunha que o
      // modelo encostava no zero depois do meu reposicionamento e não encosta — a
      // mancha ficava flutuando abaixo das rodas, o oposto do efeito pretendido.
      carro.updateMatrixWorld(true);
      var pisoBox = new THREE.Box3(), pisoTmp = new THREE.Vector3();
      var piso = Infinity, cxz = new THREE.Vector3();
      carro.traverse(function (o) {
        if (!o.isMesh || !o.visible) return;
        pisoBox.setFromObject(o); pisoBox.getSize(pisoTmp);
        if (Math.max(pisoTmp.x, pisoTmp.z) > 15) return;   // ignora as caixas mentirosas
        if (pisoBox.min.y < piso) piso = pisoBox.min.y;
      });
      new THREE.Box3().setFromObject(carro).getCenter(cxz);
      sombra.position.set(cxz.x, (isFinite(piso) ? piso : 0) + 0.004, cxz.z);
      sombra.renderOrder = -1;
      scene.add(sombra);
    })();

    reaplica();   // estado que chegou durante o carregamento

    // ── Aro ───────────────────────────────────────────────────────────────────
    // O corpo vem com pneu e cubo, mas SEM aro: o viewer monta o aro de um GLB do
    // catálogo conforme a versão (phev34 → HavalPHEV34-wheel.glb). Sem esse passo
    // a roda fica um disco preto, que é o que aparecia.
    var ARO = qs.get('aro') || '/3d/assets/wheels/HavalPHEV34-wheel.glb';
    if (ARO !== 'nenhum') {
      loader.load(ARO, function (g) {
        var proto = g.scene;
        var rodas = [];
        // O GLTFLoader SANITIZA nome de nó: `Wheel_#0` no arquivo não chega como
        // `Wheel_#0` na cena. Casar com o nome cru não encontrava nada e o aro
        // simplesmente não era montado, sem erro nenhum.
        // Ancora pelo PNEU, não pelo grupo `Wheel_`: o modelo tem 4 pneus mas só 3
        // estão dentro de um nó Wheel_ — `Tire_#000` (dianteira esquerda) está solto
        // na raiz, e era por isso que ESSA roda ficava sem aro.
        carro.traverse(function (o) { if (/^tire/i.test(o.name || '')) rodas.push(o); });
        // Entra como FILHO do nó da roda, sem escala minha: o nó já carrega o
        // transform (posição, rotação e escala) daquela roda, e aplicar uma escala
        // por cima multiplicava duas vezes — o aro nascia minúsculo dentro do pneu,
        // presente na cena e invisível na tela. `escalaAro` fica por parâmetro pra
        // ajustar no olho se o export do aro estiver noutra unidade.
        // Escala medida DEPOIS de encaixar, não antes: só com o aro já filho do nó
        // da roda é que a medida inclui o transform do pai. Tentei os dois palpites
        // antes — calcular pelo pneu sem o pai (aro microscópico dentro do pneu) e
        // usar 1:1 (aro do tamanho do carro, pra fora da caixa de roda).
        var kMan = qs.get('escalaAro');
        var cx = new THREE.Box3(), tv = new THREE.Vector3();
        rodas.forEach(function (pneu) {
          // Entra como IRMÃO do pneu: herda o transform da roda sem depender de
          // existir um grupo `Wheel_` em volta, que é o que falta numa das quatro.
          var w = pneu.parent || carro;
          var c = proto.clone(true);
          c.name = '__aro';
          w.add(c);
          if (kMan) { c.scale.setScalar(parseFloat(kMan)); return; }
          // Box3.setFromObject lê matrixWorld, que continua VELHA logo depois do
          // add(). Sem este update a medida sai do lugar antigo e a escala nunca
          // corrige — foi por isso que o aro continuou gigante duas tentativas.
          // Escala E POSIÇÃO. Só escalar não resolvia: em 1,0 o aro aparecia FORA e
          // ABAIXO da roda, ou seja o pivô dele não está no centro do cubo. Alinho
          // os centros das duas caixas depois de escalar — vale pra qualquer aro do
          // catálogo, sem constante medida à mão que envelhece no próximo export.
          w.updateMatrixWorld(true);
          cx.setFromObject(c); cx.getSize(tv);
          var dAro = Math.max(tv.x, tv.y, tv.z) || 1;
          cx.setFromObject(pneu); cx.getSize(tv);
          var dPneu = Math.max(tv.x, tv.y, tv.z) || dAro;
          c.scale.setScalar((dPneu * 0.66) / dAro);

          w.updateMatrixWorld(true);
          var ca = cx.setFromObject(c).getCenter(new THREE.Vector3());
          var cp = cx.setFromObject(pneu).getCenter(new THREE.Vector3());
          // Diferença em MUNDO convertida pro espaço do pai — somar direto em
          // position ignoraria rotação e escala do nó da roda.
          var d = cp.sub(ca);
          var inv = new THREE.Matrix4().copy(w.matrixWorld).invert();
          var origem = new THREE.Vector3(0, 0, 0).applyMatrix4(inv);
          c.position.add(d.applyMatrix4(inv).sub(origem));
        });
        pede();
        if (qs.get('diag') === '1') {
          var nomes = [];
          carro.traverse(function (o) {
            if (/wheel|tire|hub|rim/i.test(o.name || '')) nomes.push(o.name + (o.isMesh ? '*' : ''));
          });
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;left:8px;top:120px;z-index:9;background:#000c;color:#ff0;'
            + 'font:10px monospace;padding:6px;max-width:95%;white-space:pre-wrap';
          d.textContent = 'aro em ' + rodas.length + ' rodas | nós roda: ' + nomes.slice(0, 22).join(', ');
          document.body.appendChild(d);
        }
      }, undefined, function (e) { console.warn('[carro] aro falhou', e); });
    }

    msg.style.display = 'none';
    pede();
    window.__carroPronto = true;
    document.documentElement.setAttribute('data-ok', String(raio.toFixed(2)));
    if (qs.get('diag') === '1') {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:8px;top:8px;z-index:9;background:#000c;color:#0f0;'
        + 'font:11px monospace;padding:6px 8px;border-radius:6px;white-space:pre';
      d.textContent = 'tam ' + t.x.toFixed(2) + '×' + t.y.toFixed(2) + '×' + t.z.toFixed(2)
        + '\nraio ' + raio.toFixed(2)
        + '\ncanvas ' + cv.clientWidth + '×' + cv.clientHeight
        + '\ncam ' + camera.position.x.toFixed(1) + ',' + camera.position.y.toFixed(1)
        + ',' + camera.position.z.toFixed(1)
        + '\nmalhas ' + (function(){var n=0;carro.traverse(function(x){if(x.isMesh)n++;});return n;})()
        + '\nfora do enquadramento: ' + ignoradas;
      document.body.appendChild(d);
    }
  }, function (p) {
    if (p.total) msg.textContent = 'carregando o carro… ' + Math.round(p.loaded / p.total * 100) + '%';
  }, function (err) {
    msg.textContent = 'erro: ' + (err && (err.message || err.type || err)) ;
    document.documentElement.setAttribute('data-erro', String(err && (err.message || err.type || err)));
    console.error('[carro]', err);
  });

  // ── Estado do carro desenhado no modelo ───────────────────────────────────
  // Abrir a porta de verdade exigiria o rig do viewer; num carro do tamanho de um
  // dedo na tela, ACENDER a peça lê melhor que animar — e não depende de pivô.
  //
  // Nomes vêm do perfil HEV do próprio viewer, inclusive a grafia torta que ele
  // documenta: o export escreve a janela dianteira direita como `Window__FR`, com
  // underscore dobrado. Por isso o casamento é por prefixo normalizado, não igualdade.
  var COR_ABERTO = 0xff4d00, COR_LUZ = parseInt(qs.get('corluz') || 'fff0c0', 16);

  function norm(t) { return String(t || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

  /** Acende (ou apaga) todas as malhas sob os nós cujo nome casa com `alvo`. */
  function marca(alvo, ligado, cor) {
    if (!carro) return;
    var achou = false;
    carro.traverse(function (o) {
      if (!alvo(norm(o.name))) return;
      achou = true;
      o.traverse(function (x) {
        if (!x.isMesh || !x.material) return;
        if (ligado) {
          if (!x.userData.__mat0) x.userData.__mat0 = x.material;
          var m = x.userData.__mat0.clone();
          // Dois acertos que custaram tentativa: escurecer a base (senão o laranja
          // some na pintura clara) e manter a emissão BAIXA. O tone mapping é ACES
          // — emissivo forte satura e sai amarelo-pastel, que lia como defeito de
          // textura e não como aviso. 1.15 dava amarelo; 0.32 dá laranja.
          if ('emissive' in m) {
            m.color = new THREE.Color(0x140a02);
            if ('clearcoat' in m) m.clearcoat = 0;
            m.emissive = new THREE.Color(cor || COR_ABERTO);
            m.emissiveIntensity = 0.32;
          } else { m.color = new THREE.Color(cor || COR_ABERTO); }
          x.material = m;
        } else if (x.userData.__mat0) {
          x.material = x.userData.__mat0; delete x.userData.__mat0;
        }
      });
    });
    if (achou) pede();
  }

  /** Acende por MATERIAL (faróis e lanternas não têm nó próprio). */
  function marcaMat(re, ligado, cor) {
    if (!carro) return;
    carro.traverse(function (x) {
      if (!x.isMesh || !x.material || !re.test(x.material.name || '')) return;
      if (ligado) {
        if (!x.userData.__mat0) x.userData.__mat0 = x.material;
        var m = x.userData.__mat0.clone();
        if ('emissive' in m) { m.emissive = new THREE.Color(cor); m.emissiveIntensity = parseFloat(qs.get('ilum') || '3.0'); }
        m.color = new THREE.Color(cor);
        // A lente é translúcida: só somar emissivo deixava o farol do mesmo cinza.
        // Opacidade e transmissão vão a zero pra a peça virar corpo aceso.
        if ('transmission' in m) m.transmission = 0;
        m.transparent = false; m.opacity = 1;
        if ('roughness' in m) m.roughness = 0.35;
        if ('metalness' in m) m.metalness = 0;
        x.material = m;
      } else if (x.userData.__mat0) {
        x.material = x.userData.__mat0; delete x.userData.__mat0;
      }
    });
    pede();
  }

  // Slots do vetor de portas, do CAR_DOOR_SLOTS do viewer: o porta-malas é o 5,
  // não o 4 — o vetor tem buraco no meio.
  var PORTA_NO = ['doorfl', 'doorfr', 'doorbl', 'doorbr'];
  var PORTA_SLOT = [0, 1, 2, 3];
  var VIDRO_NO = ['windowfl', 'windowfr', 'windowbl', 'windowbr'];

  // O estado chega por push e NÃO se repete: o Swift só manda o que mudou. Se o
  // valor chegar antes do modelo terminar de carregar (KTX2 no iPad leva segundos),
  // aplicar na hora é perder o dado pra sempre. Guarda tudo e reaplica quando pronto.
  var estado = {}, estadoNorm = null;
  function reaplica() {
    for (var k in estado) aplica(k, estado[k]);
    if (estadoNorm) window.setCarState(estadoNorm);
  }

  window.onCarDataUpdate = function (chave, valor) {
    estado[chave] = valor;
    aplica(chave, valor);
  };

  /**
   * Entrada PREFERIDA, e a que o Painel usa: estado já normalizado pelo bridge.
   *
   * As chaves cruas do `CarConstants` só chegam pela LAN direta do carro (blocos
   * `car`/`car_raw`). Fora do alcance do carro elas não existem, e desenhar só
   * por elas deixava o Painel mudo na maior parte do tempo. Aqui entram os campos
   * que o bridge normaliza e o app já tem sempre.
   *
   * `null` é DESCONHECIDO e não desenha nada. Estado velho não vira alerta: quem
   * decide o que é fresco é o hospedeiro, com a mesma regra do resto do Painel.
   */
  window.setCarState = function (o) {
    if (!o) return;
    // Acumula em vez de substituir: o hospedeiro manda só o que mudou, e o
    // primeiro envio costuma chegar com o modelo ainda carregando.
    estadoNorm = estadoNorm || {};
    for (var q in o) estadoNorm[q] = o[q];
    if (!carro) return;
    var b = { porta_fl: 'doorfl', porta_fr: 'doorfr', porta_rl: 'doorbl',
              porta_rr: 'doorbr', porta_malas: 'hingetrunk',
              vidro_fl: 'windowfl', vidro_fr: 'windowfr',
              vidro_rl: 'windowbl', vidro_rr: 'windowbr' };
    for (var k in b) if (o[k] !== undefined && o[k] !== null) {
      (function (pref, on) {
        marca(function (n) { return n.indexOf(pref) === 0; }, !!on);
      })(b[k], o[k]);
    }
    if (o.teto !== undefined && o.teto !== null)
      marca(function (n) { return n.indexOf('sunroof') === 0; }, !!o.teto);
    if (o.farol !== undefined && o.farol !== null)
      marcaMat(/headlight|positionlight_front/i, !!o.farol, COR_LUZ);
    if (o.destrancado !== undefined)
      document.getElementById('cadeado').hidden = (o.destrancado !== true);
  };

  function aplica(chave, valor) {
    if (!carro) return;
    try {
      var v = String(valor);
      if (chave === 'car.basic.door_status') {
        // Chega entre chaves — "{0,0,0,0,0}" — e o primeiro elemento vinha como
        // "{0", que `+` transforma em NaN: a porta dianteira esquerda nunca
        // acendia. E o porta-malas é o índice 4, não o 5 (o 5 é a posição no
        // vetor do VIEWER, outro contrato).
        var d = csv(v);
        ['doorfl', 'doorfr', 'doorbl', 'doorbr'].forEach(function (nome, i) {
          if (d[i] === null) return;
          marca(function (n) { return n.indexOf(nome) === 0; }, d[i] > 0);
        });
        if (d[4] !== null && d[4] !== undefined)
          marca(function (n) { return n.indexOf('hingetrunk') === 0; }, d[4] > 0);

      } else if (chave === 'car.basic.window_status') {
        // 1=fechado, 2=aberto, 3=entreaberto. Fechado é 1 — tratar 0 como fechado
        // é o erro clássico aqui. E 0 não é fechado nem aberto: é leitura em
        // trânsito, então não desenha nada em vez de acusar vidro aberto à toa.
        var w = csv(v);
        ['windowfl', 'windowfr', 'windowbl', 'windowbr'].forEach(function (nome, i) {
          if (!w[i]) return;
          marca(function (n) { return n.indexOf(nome) === 0; }, w[i] !== 1);
        });

      } else if (chave === 'car.basic.sunroof_status' || chave === 'car.basic.sunshade_status') {
        // Percentual de abertura (200 = basculado), não booleano.
        marca(function (n) { return n.indexOf('sunroof') === 0; }, +v > 0);

      } else if (chave === 'car.basic.door_lock_status') {
        // 0 = destrancado; 1 E 3 = trancado. O 3 já foi lido como destrancado uma
        // vez e o app avisou trava aberta com o carro fechado.
        document.getElementById('cadeado').hidden = (+v !== 0);

      } else if (chave === 'car.basic.low_beam_light_status'
              || chave === 'car.basic.high_beam_light_status') {
        // Pegar só `HeadlightMain` acendia o projetor interno — dois pixels no
        // tamanho que o carro tem no Painel. A lente (`Glass (Headlight)`) e a luz
        // de posição entram junto pra o farol LER como aceso de longe. "Rear" não
        // corre risco: os materiais da lanterna são `Glass (Rear Lights)`,
        // `BrakeLight` e `PositionLight_Rear` — nenhum tem "Headlight" no nome.
        marcaMat(/headlight|positionlight_front/i, +v > 0, COR_LUZ);
      }
    } catch (e) {}
  }

  function csv(v) {
    return String(v).replace(/[^0-9,\-]/g, '').split(',').map(function (x) {
      var n = parseInt(x, 10); return isNaN(n) ? null : n;
    });
  }

  // ?teste=porta|vidro|teto|farol — injeta um estado pra conferir o desenho sem
  // depender do carro estar naquele estado.
  var teste = qs.get('teste');
  if (teste) setTimeout(function () {
    var m = { porta:  ['car.basic.door_status',   '1,1,1,1,0,1'],
              vidro:  ['car.basic.window_status', '1,2,1,2'],
              teto:   ['car.basic.sunroof_status', '60'],
              farol:  ['car.basic.low_beam_light_status', '1'],
              tranca: ['car.basic.door_lock_status', '0'] }[teste];
    if (teste === 'norm') {
      window.setCarState({ porta_fl: true, porta_malas: true, vidro_rl: true,
                           teto: true, farol: true, destrancado: true });
    } else if (teste === 'tudo') {
      window.onCarDataUpdate('car.basic.door_status', '1,0,0,0,0,1');
      window.onCarDataUpdate('car.basic.window_status', '2,1,2,1');
      window.onCarDataUpdate('car.basic.sunroof_status', '60');
      window.onCarDataUpdate('car.basic.low_beam_light_status', '1');
      window.onCarDataUpdate('car.basic.door_lock_status', '0');
    } else if (m) window.onCarDataUpdate(m[0], m[1]);
  }, 3500);
})();
</script>
</body>
</html>
