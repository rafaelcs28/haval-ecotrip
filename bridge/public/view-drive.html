<style>
/* Mapa fullscreen */
.map-fullscreen { position: fixed; inset: 0; z-index: 0; background: #0c1422; }
#map-drive { width: 100%; height: 100%; background: #0c1422; }
.leaflet-container, .leaflet-tile-pane, .leaflet-pane { background: #0c1422 !important; }

/* Header glassmorphism */














/* Pill com endereço (sob o header) */
.map-place-pill {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 70px); left: 8px; right: 8px;
  z-index: 9;
  background: rgba(20,20,20,.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 6px 14px; border-radius: 999px;
  font-size: 11px; color: #cbd5e1;
  display: flex; align-items: center; gap: 6px;
  max-width: 480px; margin: 0 auto;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.map-place-pill strong { color: var(--green); font-weight: 700; font-size: 12px; flex-shrink: 0; }
.map-place-pill .sep { color: #475569; flex-shrink: 0; }
.map-place-pill .addr { color: #94a3b8; font-size: 10px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }

/* Bottom sheet */
.bottom-sheet {
  position: fixed; left: 0; right: 0;
  bottom: var(--tabbar-h, 52px);
  z-index: 5;
  background: linear-gradient(180deg, transparent 0%, rgba(20,20,20,.92) 18%, rgba(20,20,20,.96) 100%);
  padding-bottom: 4px;
  max-height: 75vh; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transition: max-height .25s cubic-bezier(.4,.0,.2,1);
}
.bottom-sheet.collapsed { max-height: 20px; overflow: hidden; }
.sheet-handle { display: flex; justify-content: center; padding: 8px 0 4px; cursor: pointer; }
.sheet-handle .bar { width: 42px; height: 5px; background: rgba(255,255,255,.22); border-radius: 3px; transition: width .2s, background .15s; }
.sheet-handle:active .bar { background: rgba(255,255,255,.4); width: 56px; }
.bottom-sheet.collapsed .sheet-handle .bar { width: 56px; }
.sheet-inner { padding: 2px 12px 8px; max-width: 480px; margin: 0 auto; }

/* ── Hero: VELOCÍMETRO gigante ─────────────────────────────────── */
.speed-hero {
  background: rgba(31,31,31,.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 6px;
  border: 1px solid rgba(255,255,255,.04);
  display: grid; grid-template-columns: 1fr auto; gap: 14px;
  align-items: center;
}
.speed-hero .speed-block { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
.speed-hero .speed-v {
  font-size: 64px; font-weight: 200;
  letter-spacing: -3px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.speed-hero .speed-u { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
.speed-hero .power-block {
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  min-width: 100px;
}
.speed-hero .power-v {
  font-size: 26px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.speed-hero .power-v.accel { color: var(--green); }
.speed-hero .power-v.regen { color: var(--teal); }
.speed-hero .power-v.idle  { color: var(--muted); }
.speed-hero .power-lbl { font-size: 9px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; }
.speed-hero .power-bar {
  width: 100%; height: 5px; background: rgba(255,255,255,.06);
  border-radius: 3px; overflow: hidden; margin-top: 4px;
  position: relative;
}
.speed-hero .power-bar .fill {
  position: absolute; top: 0; bottom: 0; left: 50%;
  background: var(--green); border-radius: 3px;
  transition: width .2s, transform .2s, background .2s;
}
.speed-hero .power-bar .center {
  position: absolute; top: -2px; bottom: -2px; left: 50%;
  width: 1px; background: rgba(255,255,255,.2);
}

/* Grid 2x2 das stats da viagem */
.trip-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin-bottom: 6px;
}
.trip-card {
  background: rgba(31,31,31,.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  padding: 8px 12px;
  display: flex; flex-direction: column; gap: 2px;
  min-height: 56px;
  border: 1px solid rgba(255,255,255,.04);
}
.trip-card .lbl {
  font-size: 9px; letter-spacing: 1.4px; color: var(--muted);
  text-transform: uppercase; font-weight: 700;
}
.trip-card .v {
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 1;
}
.trip-card .u { font-size: 11px; color: var(--muted); font-weight: 500; }
.trip-card .sub { font-size: 9.5px; color: var(--muted); font-weight: 500; margin-top: auto; }
.trip-card.green .v { color: var(--green); }
.trip-card.teal  .v { color: var(--teal); }
.trip-card.yellow .v { color: var(--yellow); }

/* Tiny row: 3 ou 4 cards conforme houver RPM (motor térmico ligado) */
.tiny-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 6px; }
.tiny-row.has-rpm { grid-template-columns: repeat(4, 1fr); }
.tiny-card {
  background: rgba(31,31,31,.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 9px;
  padding: 6px 9px;
  border: 1px solid rgba(255,255,255,.04);
  display: flex; flex-direction: column; gap: 2px;
}
.tiny-card .lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
.tiny-card .v { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tiny-card .v small {
  font-size: 8px; color: var(--muted); font-weight: 500;
  margin-left: 1px; letter-spacing: 0.2px;
}
.tiny-card .v .sep { color: #475569; margin: 0 2px; font-weight: 400; }
/* Quando 4 cards na linha (modo híbrido) reduz fonte pra caber */
.tiny-row.has-rpm .tiny-card .v { font-size: 11px; }
.tiny-row.has-rpm .tiny-card .v small { font-size: 7px; }
.tiny-row.has-rpm .tiny-card .lbl { font-size: 7.5px; letter-spacing: 1px; }

/* Tabbar */





/* Dev bar */
.dev-bar { position: fixed; top: 4px; right: 4px; background: rgba(0,0,0,.7); border-radius: 8px; padding: 4px 8px; font-size: 9px; color: #94a3b8; z-index: 99; font-weight: 600; }
.dev-bar .snap { color: var(--yellow); }
</style>

let map = null, marker = null, routeLine = null;
let _lastLat = 0, _lastLng = 0, _lastAddress = '';

function _findKp(kpData, lat, lng) {
  if (!kpData || !kpData.length || !lat) return null;
  const R = 6371000, toRad = d => d * Math.PI / 180;
  let best = null;
  for (const p of kpData) {
    if (!p.lat) continue;
    const dLat = toRad(p.lat - lat), dLng = toRad(p.lng - lng);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat))*Math.cos(toRad(p.lat))*Math.sin(dLng/2)**2;
    const d = 2 * R * Math.asin(Math.sqrt(a));
    if (d <= (p.radius_m || 200)) {
      if (!best || (best.radius_m || 200) > (p.radius_m || 200)) best = p;
    }
  }
  return best;
}

function fmtDuration(secs) {
  if (!secs || secs < 60) return Math.round(secs || 0) + 's';
  const mins = Math.round(secs / 60);
  if (mins < 60) return mins + ' min';
  const hrs = Math.floor(mins / 60), rem = mins % 60;
  return hrs + 'h ' + rem + 'm';
}
function fmt1(n) { return (Math.round(n * 10) / 10).toString(); }
function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }

async function updateAddress(lat, lng) {
  if (Math.abs(lat - _lastLat) < 0.0005 && Math.abs(lng - _lastLng) < 0.0005) return;
  _lastLat = lat; _lastLng = lng;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`);
    const g = await r.json();
    const a = g.address || {};
    _lastAddress = [a.road, a.suburb || a.neighbourhood || a.quarter, a.city || a.town].filter(Boolean).join(', ');
    renderPlace();
  } catch (_) {}
}

let currentKp = null;
function renderPlace() {
  const hd = document.getElementById('hd-place');
  const mp = document.getElementById('mp-place');
  const ad = document.getElementById('mp-addr');
  if (currentKp) {
    hd.textContent = currentKp.name.toUpperCase();
    mp.textContent = currentKp.name;
    ad.textContent = _lastAddress || '--';
  } else {
    const first = (_lastAddress || '').split(',')[0] || '--';
    hd.textContent = first.toUpperCase();
    mp.textContent = (_lastAddress || '').split(',').slice(0, 2).join(',').trim() || first;
    ad.textContent = (_lastAddress || '').split(',').slice(2).join(',').trim() || '';
  }
}

function render(s, kpData) {
  // ── Mapa fullscreen + trajeto da viagem (polyline verde) + pin atual
  if (s.gps_lat && s.gps_lng) {
    const pos = [s.gps_lat, s.gps_lng];
    if (!map) {
      map = L.map("map-drive", {
        zoomControl: false, attributionControl: false, dragging: true, zoomSnap: 0.5,
      }).setView(pos, 16);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    }
    // Polyline do trajeto (samples até agora)
    if (Array.isArray(s.trip_route) && s.trip_route.length > 1) {
      if (routeLine) { routeLine.remove(); }
      routeLine = L.polyline(s.trip_route, {
        color: '#22c55e', weight: 4, opacity: .85, lineCap: 'round', lineJoin: 'round',
      }).addTo(map);
    }
    if (marker) marker.setLatLng(pos);
    else marker = L.marker(pos, { icon: L.divIcon({
      className: '',
      html: '<div style="width:20px;height:20px;background:#22c55e;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(34,197,94,.35),0 0 0 14px rgba(34,197,94,.12),0 2px 8px rgba(0,0,0,.4);"></div>',
      iconSize: [20,20], iconAnchor: [10,10]
    }) }).addTo(map);
    // Centraliza na metade superior (acima do sheet)
    const sheet = document.querySelector('.bottom-sheet');
    const sheetH = sheet && !sheet.classList.contains('collapsed') ? sheet.offsetHeight : 0;
    map.setView(pos, map.getZoom(), { animate: true });
    if (sheetH > 0) map.panBy([0, sheetH / 2], { animate: false });
    currentKp = _findKp(kpData, s.gps_lat, s.gps_lng);
    updateAddress(s.gps_lat, s.gps_lng);
    renderPlace();
  }

  // ── Header gear pill (D/N/R/P)
  const gear = s.gear || '--';
  const gp = document.getElementById('hd-gear');
  gp.textContent = gear;
  gp.className = 'gear-pill ' + (gear === 'P' ? 'park' : gear === 'R' ? 'reverse' : gear === 'N' ? 'neutral' : '');

  // ── HERO: velocidade — APK publica -1 quando não há leitura válida (carro parado/desligado)
  const spdRaw = +s.speed_kmh;
  const spd = (Number.isFinite(spdRaw) && spdRaw >= 0) ? spdRaw : 0;
  document.getElementById('speed-v').textContent = Math.round(spd);

  // ── Potência atual (motor_power_kw):
  // > 0 = acelerando (verde), < 0 = regen (teal), ~0 = idle (muted)
  const pwr = +s.motor_power_kw || 0;
  const pwrEl = document.getElementById('power-v');
  const pwrLbl = document.getElementById('power-lbl');
  const fill = document.getElementById('power-fill');
  if (Math.abs(pwr) < 0.3) {
    pwrEl.textContent = '0 kW';
    pwrEl.className = 'power-v idle';
    pwrLbl.textContent = 'Potência';
    fill.style.width = '0';
  } else if (pwr > 0) {
    pwrEl.textContent = '+' + fmt1(pwr) + ' kW';
    pwrEl.className = 'power-v accel';
    pwrLbl.textContent = '↑ Acelerando';
    // Bar: cresce pra direita (max 80kW)
    const pct = Math.min(50, (pwr / 80) * 50);
    fill.style.width = pct + '%';
    fill.style.transform = 'none';
    fill.style.background = 'var(--green)';
  } else {
    pwrEl.textContent = fmt1(pwr) + ' kW';
    pwrEl.className = 'power-v regen';
    pwrLbl.textContent = '↺ Regenerando';
    const pct = Math.min(50, (Math.abs(pwr) / 50) * 50);
    fill.style.width = pct + '%';
    fill.style.transform = `translateX(-100%)`;
    fill.style.background = 'var(--teal)';
  }

  // ── Stats grid da viagem em andamento
  const ct = s.current_trip;
  if (ct) {
    document.getElementById('trip-time').textContent = fmtDuration(+ct.timeSec || 0);
    document.getElementById('trip-dist').textContent = fmt1(+ct.distKm || 0);
    document.getElementById('trip-kwh').textContent  = fmt2(+ct.netKwh || 0);
    const regenStr = +ct.regenKwh > 0.01 ? ('regen ' + fmt2(ct.regenKwh) + ' kWh') : 'sem regen';
    document.getElementById('trip-kwh-sub').textContent = regenStr;
    const cost = ((+ct.netKwh || 0) * (+s.price_kwh || 0)) + ((+ct.fuelL || 0) * (+s.price_gas_per_l || 0));
    document.getElementById('trip-cost').textContent = fmt2(cost);
    const avgKm = +ct.avgSpeedKmh > 0 ? Math.round(ct.avgSpeedKmh) + ' km/h méd' : '';
    document.getElementById('trip-cost-sub').textContent = avgKm;
  }

  // ── Tiny row: SOC · Autonomia EV · Temp (int + ext) · RPM (condicional)
  document.getElementById('t-soc').textContent = s.soc_pct != null ? Math.round(s.soc_pct) + '%' : '--';
  document.getElementById('t-ev').textContent  = s.autonomy_ev_km != null ? Math.round(s.autonomy_ev_km) + ' km' : '--';
  document.getElementById('t-tempin').textContent  = s.inside_temp  != null ? Math.round(s.inside_temp)  + '°' : '--';
  document.getElementById('t-tempout').textContent = s.outside_temp != null ? Math.round(s.outside_temp) + '°' : '--';
  // Motor térmico: só mostra quando RPM > 0 (PHEV em modo híbrido / motor ligado)
  const rpm = +s.engine_rpm || 0;
  const rpmCard = document.getElementById('t-rpm-card');
  const tinyRow = document.getElementById('tiny-row');
  if (rpm > 0) {
    rpmCard.style.display = '';
    tinyRow.classList.add('has-rpm');
    document.getElementById('t-rpm').textContent = rpm.toLocaleString('pt-BR');
  } else {
    rpmCard.style.display = 'none';
    tinyRow.classList.remove('has-rpm');
  }
}

function toggleSheet() {
  const sheet = document.getElementById('bottom-sheet');
  sheet.classList.toggle('collapsed');
  setTimeout(() => {
    if (!map || !marker) return;
    const pos = marker.getLatLng();
    const sheetH = sheet.classList.contains('collapsed') ? 0 : sheet.offsetHeight;
    map.invalidateSize();
    map.setView(pos, map.getZoom(), { animate: true });
    if (sheetH > 0) map.panBy([0, sheetH / 2], { animate: false });
  }, 280);
}

function updateTabbarHeight() {
  const tabH = document.querySelector('.tabbar')?.offsetHeight || 52;
  document.documentElement.style.setProperty('--tabbar-h', tabH + 'px');
}

// Bootstrap — live se houver token; senão snapshot
updateTabbarHeight();
window.addEventListener('resize', updateTabbarHeight);

let _driveLiveTimer = null;
let _driveKp = null;
let _driveLoggedOnce = false;
async function _renderDriveLive() {
  const tk = localStorage.getItem('bridge_token');
  if (!tk) { render(SNAPSHOT.state, SNAPSHOT.known_places); return; }
  try {
    const h = { 'Authorization': 'Bearer ' + tk };
    const s = await fetch('/api/state', { headers: h }).then(r => r.json());
    if (!_driveKp) {
      _driveKp = await fetch('/api/known-places', { headers: h }).then(r => r.json()).catch(() => SNAPSHOT.known_places);
    }
    try { render(s, _driveKp); }
    catch (re) {
      if (!_driveLoggedOnce) {
        console.error('Drive render erro:', re);
        if (window.showToast) window.showToast('Drive: ' + re.message, 'err');
        _driveLoggedOnce = true;
      }
    }
  } catch (e) {
    if (!_driveLoggedOnce) {
      console.error('Drive fetch erro:', e);
      if (window.showToast) window.showToast('Drive: ' + e.message, 'err');
      _driveLoggedOnce = true;
    }
  }
}
if (localStorage.getItem('bridge_token')) {
  _renderDriveLive();
  // Drive precisa ser responsivo: polling 1s
  _driveLiveTimer = setInterval(_renderDriveLive, 1000);
} else {
  render(SNAPSHOT.state, SNAPSHOT.known_places);
}
window.renderView_drive = function() {
  if (window.state && Object.keys(window.state).length) {
    try { render(window.state, _driveKp || SNAPSHOT.known_places); } catch (_) {}
  }
};
  // Expõe handlers de onclick no window
  Object.assign(window, { toggleSheet: typeof toggleSheet !== 'undefined' ? toggleSheet : undefined });
  if (!window['initView_drive']) window['initView_drive'] = function() {};
})();
</script>
