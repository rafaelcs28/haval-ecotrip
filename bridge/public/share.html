<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haval — status ao vivo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0b0d10; --card:#16181d; --text:#f5f5f5; --muted:#8b93a1; --green:#22c55e; --blue:#38bdf8; --teal:#22d3ee; --orange:#fb923c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  #map { position:absolute; inset:0; background:#e8eaed; }
  .leaflet-container { background:#e8eaed; }
  .top { position:absolute; top:0; left:0; right:0; z-index:500; padding:12px 14px;
         background:linear-gradient(180deg, rgba(0,0,0,.8), rgba(0,0,0,0)); pointer-events:none; }
  .title { font-size:15px; font-weight:700; letter-spacing:.02em; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; margin-left:8px; }
  .badge.on { background:rgba(34,197,94,.2); color:var(--green); }
  .badge.off { background:rgba(251,146,60,.2); color:var(--orange); }
  .panel { position:absolute; left:10px; right:10px; bottom:10px; z-index:500;
           background:rgba(22,24,29,.92); border:1px solid rgba(255,255,255,.08); border-radius:16px;
           padding:14px; backdrop-filter:blur(8px); }
  .eta { font-size:15px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .eta .km { color:var(--teal); }
  .dest { font-size:15px; font-weight:700; margin-bottom:8px; padding:10px 12px; border-radius:12px;
          background:rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.3); color:var(--text); }
  .dest .name { color:var(--green); } .dest .v { color:var(--green); }
  .dest .stops { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.1);
                 display:flex; flex-direction:column; gap:5px; }
  .dest .stops-h { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .dest .stop { font-size:13px; font-weight:600; color:var(--muted); }
  .dest .stop .sn { color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .cell { background:rgba(255,255,255,.05); border-radius:11px; padding:7px 5px; text-align:center; }
  .cell .v { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
  .cell .l { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:1px; }
  .v.soc { color:var(--green); } .v.spd { color:var(--text); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
          padding:4px 9px; border-radius:999px; background:rgba(255,255,255,.06);
          border:1px solid rgba(255,255,255,.08); color:var(--text); }
  /* Placa de velocidade estilo Waze: círculo branco, aro vermelho, número grande. */
  .speed-sign { position:absolute; top:56px; left:12px; z-index:600; width:66px; height:66px;
                border-radius:50%; background:#fff; border:5px solid #e11d48;
                display:none; flex-direction:column; align-items:center; justify-content:center;
                box-shadow:0 3px 10px rgba(0,0,0,.5); }
  .speed-sign .num { font-size:26px; font-weight:800; color:#0b0d10; line-height:1; font-variant-numeric:tabular-nums; }
  .speed-sign .u   { font-size:9px; font-weight:700; color:#64748b; text-transform:uppercase; margin-top:1px; }
  .chip .ck { color:var(--muted); font-weight:600; }
  .chip.ac-on  { background:rgba(56,189,248,.16); border-color:rgba(56,189,248,.35); }
  .chip.ac-off { color:var(--muted); }
  .chip.mode   { background:rgba(34,197,94,.14); border-color:rgba(34,197,94,.3); }
  .chip.alert  { background:rgba(239,68,68,.18); border-color:rgba(239,68,68,.4); color:#fecaca; }
  .car-rot { transition:transform .6s ease-out; }
  .badge.stale { background:rgba(251,146,60,.25); color:var(--orange); }
  .ask { color:var(--muted); font-size:13px; }
  .ask a { color:var(--teal); text-decoration:underline; cursor:pointer; }
  .expired { position:absolute; inset:0; z-index:900; display:none; align-items:center; justify-content:center;
             background:rgba(0,0,0,.85); text-align:center; padding:30px; }
  .car-ico { background:none; border:none; }
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <span class="title">🚗 Haval ao vivo</span>
  <span id="state-badge" class="badge on">conectando…</span>
</div>
<!-- Banner do destinatário: aparece quando o link foi criado com nome+role.
     Se role=grasi e ainda não pareado, mostra botão pra abrir Grasi Recarga. -->
<div id="recipient-banner" style="display:none;position:fixed;top:50px;left:8px;right:8px;
     background:rgba(244,114,182,.18);border:1px solid rgba(244,114,182,.5);
     border-radius:12px;padding:10px 14px;color:#fff;font-size:14px;z-index:5;
     box-shadow:0 4px 16px rgba(0,0,0,.5)">
  <div id="recipient-text" style="font-weight:600;margin-bottom:2px"></div>
  <div id="recipient-sub" style="font-size:12px;color:#cbd5e1"></div>
  <a id="recipient-pair-btn" href="#" style="display:none;margin-top:8px;padding:9px 14px;
     background:#f472b6;color:#000;border-radius:8px;text-decoration:none;font-weight:700;
     display:inline-block;font-size:13px">Parear no app Grasi Recarga</a>
</div>
<div class="speed-sign" id="speed-sign"><div class="num" id="v-spd">—</div><div class="u">km/h</div></div>
<div class="panel">
  <div class="dest" id="dest-line" style="display:none"></div>
  <div class="eta" id="eta-line"><span class="ask">Toque em <a onclick="askGeo()">permitir localização</a> para ver a distância até você.</span></div>
  <div class="grid">
    <div class="cell"><div class="v soc" id="v-soc">—</div><div class="l">SOC %</div></div>
    <div class="cell"><div class="v" id="v-fuel">—</div><div class="l">tanque L</div></div>
    <div class="cell"><div class="v" id="v-ev">—</div><div class="l">aut. EV km</div></div>
    <div class="cell"><div class="v" id="v-ice">—</div><div class="l">aut. gás km</div></div>
    <div class="cell"><div class="v" id="v-km">—</div><div class="l">km viagem</div></div>
    <div class="cell"><div class="v" id="v-time">—</div><div class="l">tempo</div></div>
    <div class="cell"><div class="v" id="v-tin">—</div><div class="l">interna °C</div></div>
    <div class="cell"><div class="v" id="v-tout">—</div><div class="l">externa °C</div></div>
    <div class="cell"><div class="v" id="v-odo">—</div><div class="l">odômetro km</div></div>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="expired" id="expired"><div><div style="font-size:40px">🔒</div><div style="font-size:18px;font-weight:700;margin-top:8px">Link expirado</div><div style="color:var(--muted);margin-top:6px">Peça um novo link ao dono do carro.</div><div id="exp-tok" style="color:#475569;margin-top:14px;font-size:11px;word-break:break-all"></div></div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const API = (p) => `/api/share/${TOKEN}${p}`;
const map = L.map('map', { zoomControl:false, attributionControl:false }).setView([-16.6869,-49.2648], 14);
// Voyager (claro, ruas legíveis) em vez de dark_all — o destinatário precisa ler
// as ruas no zoom afastado. Os painéis flutuantes seguem escuros sobre o mapa claro.
L.tileLayer('https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png', { maxZoom:20 }).addTo(map);

// Seta de navegação que aponta pro rumo (car_heading). A ponta da seta é o "norte"
// do SVG (0°), então rotate(heading) aponta na direção real do deslocamento.
const carIcon = L.divIcon({ className:'car-ico', html:'<div id="car-rot" class="car-rot" style="width:36px;height:36px;border-radius:50%;background:#22d3ee;border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #000"><svg width="20" height="20" viewBox="0 0 24 24" fill="#0b0d10"><path d="M12 2l7 18-7-4-7 4z"/></svg></div>', iconSize:[36,36], iconAnchor:[18,18] });
const meIcon  = L.divIcon({ className:'car-ico', html:'<div style="width:16px;height:16px;border-radius:50%;background:#38bdf8;border:3px solid #fff;box-shadow:0 0 8px #38bdf8"></div>', iconSize:[16,16], iconAnchor:[8,8] });
let carMarker=null, meMarker=null, me=null, autoFollow=true;
map.on('dragstart', () => autoFollow=false);

function fmtTime(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return h>0?`${h}h${String(m).padStart(2,'0')}`:`${m}min`; }

let _fail = 0, _everOK = false;
function showExpired(){ document.getElementById('exp-tok').textContent = 'token: ' + (TOKEN || '(vazio)'); document.getElementById('expired').style.display='flex'; }
function hideExpired(){ document.getElementById('expired').style.display='none'; }
async function poll(){
  let j;
  try {
    const r = await fetch(API('/state') + '?_=' + Date.now(), {cache:'no-store'});
    if (r.status === 404) { _fail++; if (_fail >= 3 && !_everOK) showExpired(); return; }
    if (!r.ok) return;                 // transitório (502/timeout do funnel) → tenta de novo
    j = await r.json();
  } catch(_) { return; }
  _fail = 0; _everOK = true; hideExpired();
  // Banner do destinatário (idempotente — popula uma vez quando vem do estado).
  const rec = j.recipient;
  const banner = document.getElementById('recipient-banner');
  if (rec && rec.name) {
    banner.style.display = 'block';
    document.getElementById('recipient-text').textContent =
      rec.role === 'grasi' ? `📲 Esse link é pra ${rec.name}` : `Link compartilhado com ${rec.name}`;
    document.getElementById('recipient-sub').textContent =
      rec.role === 'grasi'
        ? (rec.paired ? 'Pareado ✓ — seu iPhone já está identificado.' : 'Abra no iPhone da Grasi pra parear o app.')
        : '';
    const btn = document.getElementById('recipient-pair-btn');
    if (rec.role === 'grasi' && !rec.paired) {
      btn.style.display = 'inline-block';
      btn.href = `grasi-recarga://pair?token=${TOKEN}`;
    } else {
      btn.style.display = 'none';
    }
  }
  const badge = document.getElementById('state-badge');
  // apkAgeMs = quanto tempo o BRIDGE está sem mensagem do APK. >15s = MQTT/4G hipiou
  // e os números abaixo podem estar congelados — avisa o destinatário do link.
  // (15s tolera o APK reduzir publicação com carro parado em farol/sinal.)
  const stale = j.apkAgeMs != null && j.apkAgeMs > 15000;
  if (stale){ badge.className='badge stale'; badge.textContent = `sem sinal há ${Math.round(j.apkAgeMs/1000)}s`; }
  else if (j.on){ badge.className='badge on'; badge.textContent = j.moving ? 'em movimento' : 'ligado'; }
  else     { badge.className='badge off'; badge.textContent='desligado'; }
  // Velocidade só vem do APK (não do HA cloud). Se a última msg dela tá velha,
  // o número anterior fica congelado — melhor mostrar "—" do que enganar.
  const speedStale = j.speedAgeMs != null && j.speedAgeMs > 10000;
  const sign = document.getElementById('speed-sign');
  if (j.on && !speedStale) {
    document.getElementById('v-spd').textContent = Math.round(j.speedKmh);
    sign.style.display = 'flex';
  } else { sign.style.display = 'none'; }
  document.getElementById('v-fuel').textContent = (j.fuelL != null && j.fuelL > 0) ? j.fuelL.toFixed(1).replace('.', ',') : '—';
  document.getElementById('v-soc').textContent  = j.soc || '—';
  document.getElementById('v-ev').textContent   = j.evRemainKm  || '—';
  document.getElementById('v-ice').textContent  = j.iceRemainKm || '—';
  document.getElementById('v-km').textContent   = (j.tripKm||0).toFixed(1).replace('.',',');
  document.getElementById('v-time').textContent = fmtTime(j.tripSec||0);
  document.getElementById('v-tin').textContent  = j.tempIn  ? Math.round(j.tempIn)  : '—';
  document.getElementById('v-tout').textContent = j.tempOut ? Math.round(j.tempOut) : '—';
  document.getElementById('v-odo').textContent  = j.odometer ? j.odometer.toLocaleString('pt-BR') : '—';
  // Chips de status (categóricos): alertas primeiro, depois modo/marcha/terreno/AC/ar.
  const esc2 = s => String(s||'').replace(/</g,'&lt;');
  const chips = [];
  (j.alerts||[]).forEach(t => chips.push(`<span class="chip alert">⚠️ ${esc2(t)}</span>`));
  if (j.on && j.driveMode) chips.push(`<span class="chip mode">🔋 ${j.driveMode}</span>`);
  if (j.on && j.gear && j.gear !== '--') chips.push(`<span class="chip"><span class="ck">marcha</span> ${j.gear}</span>`);
  if (j.on && j.terrain && j.terrain !== 'Normal') chips.push(`<span class="chip">🏔️ ${j.terrain}</span>`);
  if (j.on) {
    if (j.ac) chips.push(`<span class="chip ac-on">❄️ AC${j.setTemp ? ' ' + j.setTemp.toFixed(0) + '°' : ''}</span>`);
    else      chips.push(`<span class="chip ac-off">❄️ AC off</span>`);
  }
  if (j.pm25 != null) chips.push(`<span class="chip">🌫️ PM2.5 ${j.pm25}</span>`);
  document.getElementById('chips').innerHTML = chips.join('');
  // Destino ativo: distância, tempo e hora de chegada.
  const dl = document.getElementById('dest-line');
  if (j.dest && j.dest.distKm != null) {
    const esc = s => String(s||'').replace(/</g,'&lt;');
    const km = (j.dest.distKm).toFixed(1).replace('.', ',');
    const clock = j.dest.etaClock ? ` · chega ${j.dest.etaClock}` : '';
    let html = `🏁 Indo pra <span class="name">${esc(j.dest.name||'destino')}</span> · <span class="v">${km} km</span> · ${j.dest.etaMin} min${clock}`;
    // Paradas intermediárias (não-final) na ordem do trajeto.
    const stops = (j.dest.legs||[]).filter(l => !l.isFinal);
    if (stops.length) {
      html += `<div class="stops"><div class="stops-h">Paradas</div>` + stops.map(s => {
        const sk = (s.distKm||0).toFixed(1).replace('.', ',');
        const sc = s.etaClock ? ` · ${s.etaClock}` : '';
        return `<div class="stop">📍 <span class="sn">${esc(s.name)}</span> · ${sk} km${sc}</div>`;
      }).join('') + `</div>`;
    }
    dl.innerHTML = html;
    dl.style.display = '';
  } else { dl.style.display = 'none'; }
  if (j.lat && j.lng){
    const ll = [j.lat, j.lng];
    if (!carMarker) carMarker = L.marker(ll, {icon:carIcon}).addTo(map);
    else carMarker.setLatLng(ll);
    // Aponta a seta pro rumo do carro. Só gira em movimento — parado o heading
    // antigo não significa nada e ficaria girando à toa.
    if (j.moving) { const rot = document.getElementById('car-rot'); if (rot) rot.style.transform = `rotate(${j.heading||0}deg)`; }
    if (autoFollow) map.setView(ll, Math.max(map.getZoom(),14), {animate:true});
  }
}

let etaLast=0;
async function updateEta(){
  if (!me || Date.now()-etaLast < 15000) return;
  etaLast = Date.now();
  try {
    const r = await fetch(API(`/eta?to_lat=${me[0]}&to_lng=${me[1]}`), {cache:'no-store'});
    const j = await r.json();
    if (j.ok) document.getElementById('eta-line').innerHTML =
      `<span>🧭 <span class="km">${j.distKm.toFixed(1).replace('.',',')} km</span> · ${j.etaMin} min de carro até você</span>`;
  } catch(_){}
}
function askGeo(){
  if (!navigator.geolocation){ alert('Geolocalização não suportada.'); return; }
  navigator.geolocation.watchPosition(p => {
    me = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.marker(me,{icon:meIcon}).addTo(map); else meMarker.setLatLng(me);
    updateEta();
  }, _ => { document.getElementById('eta-line').innerHTML = '<span class="ask">Sem permissão de localização — não dá pra calcular a distância.</span>'; },
  { enableHighAccuracy:true, maximumAge:10000 });
}

let _pollTimer=null, _etaTimer=null;
// Recria os timers do zero. Safari/Chrome no celular SUSPENDEM setInterval em
// background/tela bloqueada e congelam a página no BFCache — ao voltar pro app o
// timer antigo não re-dispara e o mapa fica parado até um refresh manual. Em vez
// de confiar que o interval velho ressuscita, derruba e rearma a cada retorno.
function rearm(){
  if (_pollTimer) clearInterval(_pollTimer);
  if (_etaTimer)  clearInterval(_etaTimer);
  poll(); updateEta();
  _pollTimer = setInterval(poll, 1000);
  _etaTimer  = setInterval(updateEta, 2000);
}
if (!TOKEN){ showExpired(); }
else {
  rearm();
  // Gatilhos de "a página voltou a ficar viva": foreground, restauração do
  // BFCache (pageshow), foco da aba e reconexão de rede.
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') rearm(); });
  window.addEventListener('pageshow', rearm);
  window.addEventListener('focus',    rearm);
  window.addEventListener('online',   rearm);
}
</script>
</body>
</html>
