const FILTERS = [
  { id: 'all',    label: 'Tudo',    icon: '' },
  { id: 'engine', label: 'Motor',   icon: '🔑', cats: ['engine'] },
  { id: 'trip',   label: 'Viagens', icon: '🏁', cats: ['trip', 'geo'] },
  { id: 'charge', label: 'Recarga', icon: '⚡', cats: ['charge', 'fuel'] },
  { id: 'lock',   label: 'Trava',   icon: '🔒', cats: ['lock'] },
  { id: 'door',   label: 'Portas',  icon: '🚪', cats: ['door'] },

  { id: 'ac',     label: 'AC',      icon: '❄', cats: ['ac'] },
  { id: 'maint',  label: 'Manut.',  icon: '🔧', cats: ['maint', 'alert'] },
];
let allEvents = (SNAPSHOT.events || []).map(e => ({ ...e, ts: e.ts || e.timestamp }));
let currentFilter = 'all';
let currentSearch = '';
function metaOf(type) {
  return TYPE_META[type] || { cat: 'other', ic: '•' };
}
function labelOf(ev) {
  if (ev.label) return ev.label;
  return ev.type.replace(/_/g, ' ');
}
function countByCat(catList) {
  if (!catList) return allEvents.length;
  let n = 0;
  for (const e of allEvents) {
    if (catList.includes(metaOf(e.type).cat)) n++;
  }
  return n;
}
function applyFilter() {
  const f = FILTERS.find(x => x.id === currentFilter);
  let out = allEvents;
  if (f && f.cats) out = out.filter(e => f.cats.includes(metaOf(e.type).cat));
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    out = out.filter(e => labelOf(e).toLowerCase().includes(q) || e.type.toLowerCase().includes(q));
  }
  return out;
}
function renderFilters() {
  const el = document.getElementById('filter-chips');
  el.innerHTML = FILTERS.map(f => {
    const n = f.id === 'all' ? allEvents.length : countByCat(f.cats);
    return `<div class="chip ${currentFilter === f.id ? 'active' : ''}" onclick="setFilter('${f.id}')">${f.icon ? f.icon + ' ' : ''}${f.label}<span class="count">${n}</span></div>`;
  }).join('');
}
function setFilter(id) {
  currentFilter = id;
  renderFilters();
  renderEvents();
}
function fmtDayLabel(ts) {
  const d = new Date(ts); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today.getTime() - 86400000);
  if (d.getTime() === today.getTime()) return 'Hoje';
  if (d.getTime() === yesterday.getTime()) return 'Ontem';
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' });
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function renderEvents() {
  const list = document.getElementById('events-list');
  const empty = document.getElementById('empty-state');
  const filtered = applyFilter();
  if (!filtered.length) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  const byDay = new Map();
  for (const e of filtered) {
    const d = new Date(e.ts); d.setHours(0,0,0,0);
    const key = d.getTime();
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(e);
  }
  const html = [];
  for (const [dayKey, dayEvents] of byDay) {
    html.push(`<div class="day-hdr">${fmtDayLabel(dayKey)} · <span style="color:#cbd5e1">${dayEvents.length}</span></div>`);
    for (const e of dayEvents) {
      const m = metaOf(e.type);
      html.push(`
        <div class="event ${m.cat}">
          <div class="ic-box">${m.ic}</div>
          <div class="meta">
            <div class="title">${labelOf(e)}</div>
          </div>
          <div class="time">${fmtTime(e.ts)}</div>
        </div>`);
    }
  }
  list.innerHTML = html.join('');
}
document.getElementById('search').addEventListener('input', (ev) => {
  currentSearch = ev.target.value.trim();

});

async function _loadLogsData() {
  // 1. Render imediato do cache (offline-first)
  const cached = window.cacheGet && window.cacheGet('logs');
  let lastTs = 0;
  if (cached && Array.isArray(cached.v) && cached.v.length) {
    allEvents = cached.v;
    lastTs = Math.max(...cached.v.map(e => +e.ts || 0));
    renderFilters(); renderEvents();
  }
  // 2. Fetch incremental (só eventos novos desde o cache) + merge
  const tk = localStorage.getItem('bridge_token');
  if (!tk) { if (!cached) { renderFilters(); renderEvents(); } return; }
  const progress = !cached && window.showProgress ? window.showProgress('Baixando eventos') : null;
  try {
    if (progress) progress.set(25);
    const url = lastTs > 0 ? `/api/events?since=${lastTs}` : '/api/events?limit=500';
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + tk } });
    const list = await r.json();
    if (progress) progress.set(80);
    if (Array.isArray(list)) {
      const incoming = list.map(e => ({ ...e, ts: e.ts || e.timestamp || e.timestamp_ms }));
      if (lastTs > 0 && incoming.length) {
        // Merge incremental: prepend novos no array existente
        const existingIds = new Set(allEvents.map(e => e.id || e.ts));
        const onlyNew = incoming.filter(e => !existingIds.has(e.id || e.ts));
        if (onlyNew.length) {
          allEvents = [...onlyNew, ...allEvents];
