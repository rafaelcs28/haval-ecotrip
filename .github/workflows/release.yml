name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'          # trigger on any tag like v1.1, v1.2, v2.0
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v6.236]')
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.236' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: /tmp/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Deriva a versão da tag (vX.Y): versionName=X.Y, versionCode=X*1000+Y.
          # Garante que cada release reporte sua própria versão (senão o OTA do
          # carro não reconhece a atualização — ficava sempre "5.92").
          VNAME="${RELEASE_TAG#v}"
          MAJOR="${VNAME%%.*}"; MINOR="${VNAME#*.}"; MINOR="${MINOR%%.*}"
          # 10# força base-10: sem isso, MINOR "08"/"09" vira octal inválido (build sem
          # versionCode → cai no default → carro recusa como downgrade) e "10" virava 8.
          VCODE=$(( 10#$MAJOR * 1000 + 10#$MINOR ))
          echo "Building versionName=$VNAME versionCode=$VCODE"
          ./gradlew assembleRelease --no-daemon -PvName="$VNAME" -PvCode="$VCODE"

      - name: Rename APK
        run: |
          VERSION="$RELEASE_TAG"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_SRC" "ecotrip-impulse-${VERSION}.apk"
          echo "APK_PATH=ecotrip-impulse-${VERSION}.apk" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Ecotrip Impulse ${{ env.RELEASE_TAG }}"
          body: |
            ## Ecotrip Impulse ${{ env.RELEASE_TAG }}

            Instale o APK abaixo no sistema multimídia do Haval.
          files: ${{ env.APK_PATH }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
