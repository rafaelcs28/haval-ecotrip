# XcodeGen spec — gera HavalOBD.xcodeproj a partir desse arquivo.
# Roda: `cd ios-obd && xcodegen generate`
name: HavalOBD
options:
  bundleIdPrefix: br.com.consorciolimpagyn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "7Y6MPKR5CD"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    INFOPLIST_KEY_UIRequiresFullScreen: NO

packages:
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT
    from: "2.1.0"

targets:
  HavalOBD:
    type: application
    platform: iOS
    sources:
      - HavalOBD
      # WebAssets vão pro bundle como folder reference (com subdir preservado).
      # Permite Bundle.url(forResource:withExtension:subdirectory: "WebAssets").
      - path: HavalOBD/WebAssets
        type: folder
        buildPhase: resources
    info:
      path: HavalOBD/Info.plist
      properties:
        CFBundleDisplayName: "Haval OBD"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # Permissões obrigatórias pro iOS aprovar
        NSBluetoothAlwaysUsageDescription: >
          O Haval OBD usa Bluetooth pra conectar ao seu adaptador ELM327 e
          ler dados do carro em tempo real (RPM, SOC, temperaturas, etc).
        NSBluetoothPeripheralUsageDescription: >
          Conecta ao adaptador OBD via Bluetooth.
        NSLocalNetworkUsageDescription: >
          Conecta ao Bridge na sua rede local pra enviar a telemetria.
        # Background mode: ler BLE quando app em segundo plano (carro
        # continua mandando dados mesmo com tela bloqueada).
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        # Disable idle timer no app config — também controlado em código.
        UIApplicationSupportsIndirectInputEvents: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.havalobd
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: CocoaMQTT
