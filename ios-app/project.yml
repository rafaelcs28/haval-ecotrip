# XcodeGen spec — gera HavalEcoTrip.xcodeproj a partir desse arquivo.
# Roda: `cd ios-app && xcodegen generate`
name: HavalEcoTrip
options:
  bundleIdPrefix: br.com.consorciolimpagyn
  deploymentTarget:
    iOS: "17.0"           # onChange(of:initial:) com 2 params exige 17; ActivityKit + Dynamic Island ok
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "7Y6MPKR5CD"       # time pago do Rafael
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
  # NOTA: assinatura AUTOMÁTICA (sem fixar CODE_SIGN_IDENTITY — fixar dá conflito
  # com o style automático). No Release, o entitlements exige aps-environment
  # production, o que FORÇA a assinatura automática a usar o perfil de
  # distribuição. No Debug, usa development/sandbox. O export app-store
  # (ExportOptions.plist) re-assina tudo como distribuição.

targets:
  HavalEcoTrip:
    type: application
    platform: iOS
    # Entitlements POR CONFIGURAÇÃO (CODE_SIGN_ENTITLEMENTS em settings.configs):
    #   Debug   → HavalEcoTrip-dev.entitlements  (aps-environment development / sandbox)
    #             — build local via Xcode/devicectl, push no endpoint sandbox.
    #   Release → HavalEcoTrip-prod.entitlements (aps-environment production)
    #             — archive p/ TestFlight, push no endpoint de produção.
    # Estes .entitlements são mantidos À MÃO (não gerados pelo xcodegen).
    sources:
      - HavalEcoTrip
      # ChargeActivityAttributes precisa estar nos DOIS targets — app referencia
      # o tipo, widget também. Sem duplicação física: mesmo arquivo, duas memberships.
      - path: HavalEcoTripWidget/ChargeActivityAttributes.swift
      # Idem para a pré-climatização: o PreClimatManager (app) usa o tipo.
      - path: HavalEcoTripWidget/PreClimatActivityAttributes.swift
      # Viagem ao vivo: LiveActivityPush (app) registra os tokens do tipo.
      - path: HavalEcoTripWidget/TripActivityAttributes.swift
      # Motor ligado remotamente: idem.
      - path: HavalEcoTripWidget/MotorActivityAttributes.swift
      # Veículo desprotegido (alerta persistente): idem.
      - path: HavalEcoTripWidget/SecurityActivityAttributes.swift
      # App Intents (Siri/Atalhos) — compartilhados com o widget (botões interativos).
      - path: HavalEcoTripWidget/CarIntents.swift
      # SongPro (recarga BYD) saiu daqui — agora só no app "Grasi Recarga".
    info:
      path: HavalEcoTrip/Info.plist
      properties:
        CFBundleDisplayName: "Haval Hub"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Orientações: iPhone só retrato (PWA é vertical). iPad precisa das 4
        # pra passar a validação de multitarefa da App Store/TestFlight.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # LAN direta: descobre o APK do carro via Bonjour (_havalobd._tcp) e fala
        # WebSocket local (ws://host:8088/ws/state) sem passar pelo Mac mini.
        NSFaceIDUsageDescription: "Use o Face ID para desbloquear o app."
        NSMicrophoneUsageDescription: "Usa o microfone para falar na cabine do carro durante a escuta ao vivo."
        NSLocalNetworkUsageDescription: "Conecta direto ao carro na mesma rede Wi-Fi para telemetria e comandos com baixa latência."
        NSCalendarsUsageDescription: "Lê seus próximos compromissos para pré-climatizar o carro antes da hora de sair."
        NSCalendarsFullAccessUsageDescription: "Lê seus próximos compromissos para pré-climatizar o carro antes da hora de sair."
        NSBonjourServices:
          - _havalobd._tcp
        # canOpenURL p/ abrir a navegação neste iPhone (Waze / Google Maps).
        LSApplicationQueriesSchemes:
          - waze
          - comgooglemaps
        # IMPORTANTE: xcodegen REGENERA o Info.plist do zero a cada `generate`,
        # apagando qualquer chave não listada aqui.
        # Com APNs (conta paga) as Live Activities são dirigidas por push — não há
        # mais keep-alive de localização/áudio. Mantemos só fetch/processing p/ BGTask.
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
          - audio   # escuta ao vivo da cabine continua tocando com o app em background
        # Quick Actions (3D/Haptic Touch no ícone do app). 4 atalhos: travar,
        # destravar, ligar motor, desligar motor. AppDelegate captura o
        # shortcut e dispara o action via URL scheme havalecotrip://action/<name>.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.lock_close
            UIApplicationShortcutItemTitle: Travar
            UIApplicationShortcutItemIconSymbolName: lock.fill
            UIApplicationShortcutItemUserInfo:
              action: lock_close
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.lock_open
            UIApplicationShortcutItemTitle: Destravar
            UIApplicationShortcutItemIconSymbolName: lock.open.fill
            UIApplicationShortcutItemUserInfo:
              action: lock_open
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.engine_on
            UIApplicationShortcutItemTitle: Ligar motor
            UIApplicationShortcutItemIconSymbolName: power.circle.fill
            UIApplicationShortcutItemUserInfo:
              action: engine_on
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.engine_off
            UIApplicationShortcutItemTitle: Desligar motor
            UIApplicationShortcutItemIconSymbolName: power.circle
            UIApplicationShortcutItemUserInfo:
              action: engine_off
        BGTaskSchedulerPermittedIdentifiers:
          - br.com.consorciolimpagyn.havalecotrip.notif-refresh
        # URL scheme: PWA standalone pode chamar `havalecotrip://` no
        # notificationclick do SW pra abrir o app nativo (com toque do user).
        CFBundleURLTypes:
          - CFBundleURLName: br.com.consorciolimpagyn.havalecotrip
            CFBundleURLSchemes:
              - havalecotrip
          # Google Sign-In nativo: callback = reversed client id do OAuth client iOS.
          - CFBundleURLName: google-signin
            CFBundleURLSchemes:
              - com.googleusercontent.apps.757576020219-bl2kofq49ksrpfgk4nt2g0k2qq00u7o6
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.havalecotrip
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: HavalEcoTrip/HavalEcoTrip-dev.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: HavalEcoTrip/HavalEcoTrip-prod.entitlements
    dependencies:
      - target: HavalEcoTripWidget
      # - target: ShareExtension   # fora do archive até registrar o App Group do
      #   App ID br.com.consorciolimpagyn.havalecotrip.ShareExtension no portal.
    scheme:
      # Scheme compartilhado (gera xcshareddata/xcschemes/HavalEcoTrip.xcscheme)
      # pra `xcodebuild -scheme HavalEcoTrip` funcionar sem precisar de xcuserdata.
      gatherCoverageData: false

  HavalEcoTripWidget:
    type: app-extension
    platform: iOS
    entitlements:
      path: HavalEcoTripWidget/HavalEcoTripWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.br.com.consorciolimpagyn.havalecotrip
    sources:
      - path: HavalEcoTripWidget
        # Os arquivos do SongPro (recarga BYD) ficam fisicamente nesta pasta porque
        # o app "Grasi Recarga" (targets BydRecarga*) os referencia por path. Mas
        # NÃO entram no widget do Haval — a LA do BYD agora é só no app da Grasi.
        excludes:
          - SongProActivityAttributes.swift
          - SongProLiveActivity.swift
          - SongProTripActivityAttributes.swift
          - SongProTripLiveActivity.swift
      # Settings.swift compartilhado pra widget acessar URL/token via App Group
      - path: HavalEcoTrip/Settings.swift
    info:
      path: HavalEcoTripWidget/Info.plist
      properties:
        CFBundleDisplayName: "Haval EcoTrip Widget"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.havalecotrip.HavalEcoTripWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  # Share Extension: receber destino do Waze/Maps e mandar pro carro (/api/share-dest).
  ShareExtension:
    type: app-extension
    platform: iOS
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.br.com.consorciolimpagyn.havalecotrip
    sources:
      - path: ShareExtension
      - path: HavalEcoTrip/Settings.swift
      - path: HavalEcoTrip/AuthConfig.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Enviar pro carro"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.havalecotrip.ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  # ═══════════════════════════════════════════════════════════════════════════
  #  App minimal "BYD Recarga" (iPhone da esposa) — função única: Live Activity
  #  da recarga do BYD Song Pro. Reusa SongProActivityAttributes + a view da LA.
  # ═══════════════════════════════════════════════════════════════════════════
  BydRecarga:
    type: application
    platform: iOS
    sources:
      - path: BydRecarga
        excludes:
          - "icon-source.svg"
          - "icon-preview.png"
      # Tipos das LAs compartilhados (app referencia, widget renderiza)
      - path: HavalEcoTripWidget/SongProActivityAttributes.swift
      - path: HavalEcoTripWidget/SongProTripActivityAttributes.swift
    info:
      path: BydRecarga/Info.plist
      properties:
        CFBundleDisplayName: "Grasi Recarga"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Usamos sua localização para mostrar, na Live Activity, a distância e o tempo de carro do veículo até você."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Permitir 'Sempre' mantém a distância até o veículo atualizada na tela bloqueada, mesmo com o app fechado."
        UIBackgroundModes:
          - remote-notification
          - location   # atualização fina da localização durante a viagem (allowsBackgroundLocationUpdates)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.songpro
        TARGETED_DEVICE_FAMILY: "1"        # só iPhone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 1.0 já está released na App Store (Unlisted) → bumpa pra 1.0.1 pra
        # aceitar novos builds. Independente do MARKETING_VERSION global do Haval.
        MARKETING_VERSION: "1.0.1"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: BydRecarga/BydRecarga-dev.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: BydRecarga/BydRecarga-prod.entitlements
    dependencies:
      - target: BydRecargaWidget
    scheme:
      gatherCoverageData: false

  BydRecargaWidget:
    type: app-extension
    platform: iOS
    entitlements:
      path: BydRecargaWidget/BydRecargaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.br.com.consorciolimpagyn.songpro
    sources:
      - BydRecargaWidget
      # Reusa os tipos + as views das LAs do Song Pro (mesmos arquivos do widget Haval)
      - path: HavalEcoTripWidget/SongProActivityAttributes.swift
      - path: HavalEcoTripWidget/SongProLiveActivity.swift
      - path: HavalEcoTripWidget/SongProTripActivityAttributes.swift
      - path: HavalEcoTripWidget/SongProTripLiveActivity.swift
    info:
      path: BydRecargaWidget/Info.plist
      properties:
        CFBundleDisplayName: "BYD Recarga Widget"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.songpro.BydRecargaWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Widget tem que casar a versão do app pai (BydRecarga).
        MARKETING_VERSION: "1.0.1"
