# XcodeGen spec — gera HavalEcoTrip.xcodeproj a partir desse arquivo.
# Roda: `cd ios-app && xcodegen generate`
name: HavalEcoTrip
options:
  bundleIdPrefix: br.com.consorciolimpagyn
  deploymentTarget:
    iOS: "17.0"           # onChange(of:initial:) com 2 params exige 17; ActivityKit + Dynamic Island ok
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "7Y6MPKR5CD"       # Personal Team do Rafael
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"

targets:
  HavalEcoTrip:
    type: application
    platform: iOS
    entitlements:
      path: HavalEcoTrip/HavalEcoTrip.entitlements
      properties:
        # APNs (Live Activity push-to-start + notificações). development = sandbox,
        # casa com build de desenvolvimento via Xcode. xcodegen REGENERA este
        # arquivo a partir daqui — não editar o .entitlements direto.
        aps-environment: development
        com.apple.security.application-groups:
          - group.br.com.consorciolimpagyn.havalecotrip
    sources:
      - HavalEcoTrip
      # ChargeActivityAttributes precisa estar nos DOIS targets — app referencia
      # o tipo, widget também. Sem duplicação física: mesmo arquivo, duas memberships.
      - path: HavalEcoTripWidget/ChargeActivityAttributes.swift
      # Idem para a pré-climatização: o PreClimatManager (app) usa o tipo.
      - path: HavalEcoTripWidget/PreClimatActivityAttributes.swift
    info:
      path: HavalEcoTrip/Info.plist
      properties:
        CFBundleDisplayName: "Haval EcoTrip"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # IMPORTANTE: xcodegen REGENERA o Info.plist do zero a cada `generate`,
        # apagando qualquer chave não listada aqui.
        # Com APNs (conta paga) as Live Activities são dirigidas por push — não há
        # mais keep-alive de localização/áudio. Mantemos só fetch/processing p/ BGTask.
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        # Quick Actions (3D/Haptic Touch no ícone do app). 4 atalhos: travar,
        # destravar, ligar motor, desligar motor. AppDelegate captura o
        # shortcut e dispara o action via URL scheme havalecotrip://action/<name>.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.lock_close
            UIApplicationShortcutItemTitle: Travar
            UIApplicationShortcutItemIconSymbolName: lock.fill
            UIApplicationShortcutItemUserInfo:
              action: lock_close
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.lock_open
            UIApplicationShortcutItemTitle: Destravar
            UIApplicationShortcutItemIconSymbolName: lock.open.fill
            UIApplicationShortcutItemUserInfo:
              action: lock_open
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.engine_on
            UIApplicationShortcutItemTitle: Ligar motor
            UIApplicationShortcutItemIconSymbolName: power.circle.fill
            UIApplicationShortcutItemUserInfo:
              action: engine_on
          - UIApplicationShortcutItemType: br.com.consorciolimpagyn.havalecotrip.engine_off
            UIApplicationShortcutItemTitle: Desligar motor
            UIApplicationShortcutItemIconSymbolName: power.circle
            UIApplicationShortcutItemUserInfo:
              action: engine_off
        BGTaskSchedulerPermittedIdentifiers:
          - br.com.consorciolimpagyn.havalecotrip.notif-refresh
        # URL scheme: PWA standalone pode chamar `havalecotrip://` no
        # notificationclick do SW pra abrir o app nativo (com toque do user).
        CFBundleURLTypes:
          - CFBundleURLName: br.com.consorciolimpagyn.havalecotrip
            CFBundleURLSchemes:
              - havalecotrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.havalecotrip
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HavalEcoTripWidget
    scheme:
      # Scheme compartilhado (gera xcshareddata/xcschemes/HavalEcoTrip.xcscheme)
      # pra `xcodebuild -scheme HavalEcoTrip` funcionar sem precisar de xcuserdata.
      gatherCoverageData: false

  HavalEcoTripWidget:
    type: app-extension
    platform: iOS
    entitlements:
      path: HavalEcoTripWidget/HavalEcoTripWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.br.com.consorciolimpagyn.havalecotrip
    sources:
      - HavalEcoTripWidget
      # Settings.swift compartilhado pra widget acessar URL/token via App Group
      - path: HavalEcoTrip/Settings.swift
    info:
      path: HavalEcoTripWidget/Info.plist
      properties:
        CFBundleDisplayName: "Haval EcoTrip Widget"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.consorciolimpagyn.havalecotrip.HavalEcoTripWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
